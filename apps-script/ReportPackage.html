<!DOCTYPE html>
<html lang="ko">
  <head>
    <base target="_blank">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, "Noto Sans KR", sans-serif;
        color: #202124;
        background: #f6f8fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f6f8fb;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        padding: 18px 22px 14px;
        border-bottom: 1px solid #dfe3e8;
        background: rgba(255, 255, 255, 0.96);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 20px;
      }

      header p,
      .muted {
        margin: 0;
        color: #5f6368;
        font-size: 13px;
        line-height: 1.5;
      }

      main {
        padding: 18px 22px 80px;
      }

      #status,
      #error,
      #summary {
        margin-bottom: 14px;
        padding: 14px 16px;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 1px 3px rgba(60, 64, 67, 0.12);
      }

      #status {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      #status.success {
        color: #137333;
        border: 1px solid #9bd3aa;
        background: #f1f8f3;
      }

      #status.success .spinner {
        display: none;
      }

      #error {
        display: none;
        color: #b3261e;
        border: 1px solid #f3b8b3;
        background: #fff7f6;
        white-space: pre-wrap;
      }

      #summary {
        display: none;
        line-height: 1.6;
      }

      .spinner {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        border: 3px solid #d2e3fc;
        border-top-color: #1a73e8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      button {
        padding: 8px 13px;
        border: 1px solid #dadce0;
        border-radius: 7px;
        background: #fff;
        color: #1f1f1f;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #f8fafd;
      }

      button.primary {
        border-color: #1a73e8;
        background: #1a73e8;
        color: #fff;
      }

      button.primary:hover {
        background: #1765cc;
      }

      button.send {
        border-color: #188038;
        background: #188038;
        color: #fff;
      }

      button.send:hover {
        background: #137333;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      #bulk-actions {
        display: none;
        margin-bottom: 14px;
        padding: 12px 14px;
        border: 1px solid #dfe3e8;
        border-radius: 10px;
        background: #fff;
      }

      .report-card {
        margin-bottom: 18px;
        padding: 18px;
        border: 1px solid #dfe3e8;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 2px 7px rgba(60, 64, 67, 0.12);
      }

      .report-card h2 {
        margin: 0;
        font-size: 18px;
      }

      .report-meta {
        margin-top: 5px;
        color: #5f6368;
        font-size: 13px;
      }

      .pages {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
        gap: 16px;
        margin-top: 16px;
      }

      .page {
        min-width: 0;
        padding: 12px;
        border: 1px solid #dadce0;
        border-radius: 9px;
        background: #f8f9fa;
      }

      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 9px;
        font-size: 13px;
        font-weight: 700;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #c9ccd1;
        background: #fff;
        box-shadow: 0 2px 6px rgba(60, 64, 67, 0.16);
      }

      .footer-actions {
        position: fixed;
        right: 18px;
        bottom: 16px;
        z-index: 20;
      }

      @media (max-width: 720px) {
        header,
        main {
          padding-left: 14px;
          padding-right: 14px;
        }

        .pages {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>인쇄·카톡 보고서 자료</h1>
      <p>PDF는 인쇄에 사용하고, 페이지별 PNG는 카카오톡에 첨부하세요.</p>
    </header>

    <main>
      <div id="status">
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-text">PDF 변환 도구를 불러오는 중입니다…</span>
      </div>
      <div id="error" role="alert"></div>
      <div id="summary"></div>
      <div id="bulk-actions">
        <strong>일괄 작업</strong>
        <div class="actions">
          <button type="button" id="download-all-pdf">모든 PDF 다운로드</button>
          <button type="button" id="download-all-png" class="primary">모든 PNG 다운로드</button>
          <button type="button" id="download-and-send" class="send">자료 만들고 메일 발송하기</button>
        </div>
        <p class="muted" style="margin-top: 8px;">
          마지막 버튼은 모든 PNG 다운로드를 시작한 뒤 선택 행의 실제 수신자에게 메일을 발송합니다.
          브라우저가 여러 파일 다운로드 허용을 요청하면 허용해 주세요.
        </p>
      </div>
      <div id="reports"></div>
    </main>

    <div class="footer-actions">
      <button type="button" id="close-dialog">닫기</button>
    </div>

    <script type="module">
      const PDFJS_VERSION = '6.2.108';
      const PDFJS_MODULE_URL =
        `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VERSION}/build/pdf.min.mjs`;
      const PDFJS_WORKER_URL =
        `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VERSION}/build/pdf.worker.min.mjs`;
      const PNG_SCALE = 2.25;

      const state = {
        pdfjs: null,
        reports: [],
        packageData: null,
        objectUrls: [],
        sending: false,
      };

      const statusBox = document.getElementById('status');
      const statusText = document.getElementById('status-text');
      const errorBox = document.getElementById('error');
      const summaryBox = document.getElementById('summary');
      const reportsBox = document.getElementById('reports');
      const bulkActions = document.getElementById('bulk-actions');
      const sendButton = document.getElementById('download-and-send');

      document.getElementById('close-dialog').addEventListener('click', () => {
        window.google.script.host.close();
      });
      document.getElementById('download-all-pdf').addEventListener('click', downloadAllPdf);
      document.getElementById('download-all-png').addEventListener('click', downloadAllPng);
      sendButton.addEventListener('click', downloadPngAndSendMail);
      window.addEventListener('beforeunload', revokeObjectUrls);

      async function boot() {
        try {
          state.pdfjs = await import(PDFJS_MODULE_URL);
          state.pdfjs.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
          setStatus('선택한 행의 보고서 PDF를 생성하는 중입니다…');

          window.google.script.run
            .withSuccessHandler((data) => {
              renderPackage(data).catch(showError);
            })
            .withFailureHandler(showError)
            .buildPrintPackageData();
        } catch (error) {
          showError(
            `PDF 변환 도구를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 실행해 주세요.\n${toErrorMessage(error)}`,
          );
        }
      }

      async function renderPackage(data) {
        if (!data || !Array.isArray(data.reports) || data.reports.length === 0) {
          throw new Error('생성된 보고서가 없습니다. 보고서종류를 확인해 주세요.');
        }

        state.packageData = data;
        state.reports = [];
        summaryBox.textContent =
          `${data.period.dateKorean} · ${data.period.weekLabel} · ${data.reportType} · 생성 ${data.generatedAt}`;
        summaryBox.style.display = 'block';
        reportsBox.replaceChildren();

        for (let index = 0; index < data.reports.length; index += 1) {
          const report = data.reports[index];
          setStatus(`${report.title} PDF를 PNG로 변환하는 중입니다…`);
          const reportState = await renderReport(report);
          state.reports.push(reportState);
        }

        statusBox.style.display = 'none';
        bulkActions.style.display = 'block';
        if (data.sendSummary && data.sendSummary.alreadySent) {
          sendButton.disabled = true;
          sendButton.textContent = '이미 실제 발송 완료';
        }
      }

      async function renderReport(report) {
        const pdfBytes = base64ToBytes(report.pdfBase64);
        const pdfBlob = new Blob([pdfBytes], { type: 'application/pdf' });
        const pdfUrl = URL.createObjectURL(pdfBlob);
        state.objectUrls.push(pdfUrl);

        const loadingTask = state.pdfjs.getDocument({
          data: pdfBytes,
          enableScripting: false,
          isEvalSupported: false,
        });
        const pdf = await loadingTask.promise;
        const card = document.createElement('section');
        card.className = 'report-card';

        const title = document.createElement('h2');
        title.textContent = report.title;
        card.appendChild(title);

        const meta = document.createElement('div');
        meta.className = 'report-meta';
        meta.textContent = `${report.pdfName} · ${pdf.numPages}페이지`;
        card.appendChild(meta);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.appendChild(
          makeButton('PDF 열기·인쇄', 'primary', () => openPdf(pdfUrl)),
        );
        actions.appendChild(
          makeButton('PDF 다운로드', '', () => downloadBlob(pdfBlob, report.pdfName)),
        );
        card.appendChild(actions);

        const pagesContainer = document.createElement('div');
        pagesContainer.className = 'pages';
        card.appendChild(pagesContainer);
        reportsBox.appendChild(card);

        const pages = [];
        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
          const page = await pdf.getPage(pageNumber);
          const viewport = page.getViewport({ scale: PNG_SCALE });
          const canvas = document.createElement('canvas');
          canvas.width = Math.ceil(viewport.width);
          canvas.height = Math.ceil(viewport.height);
          const context = canvas.getContext('2d', { alpha: false });
          context.fillStyle = '#ffffff';
          context.fillRect(0, 0, canvas.width, canvas.height);

          await page.render({
            canvas,
            viewport,
            background: '#ffffff',
          }).promise;

          const pngName = buildPngName(report.pdfName, pageNumber, pdf.numPages);
          const pageBox = document.createElement('div');
          pageBox.className = 'page';
          const pageHeader = document.createElement('div');
          pageHeader.className = 'page-header';
          const pageLabel = document.createElement('span');
          pageLabel.textContent = `${pageNumber} / ${pdf.numPages} 페이지`;
          pageHeader.appendChild(pageLabel);
          pageHeader.appendChild(
            makeButton('PNG 다운로드', '', () => downloadCanvas(canvas, pngName)),
          );
          pageBox.appendChild(pageHeader);
          pageBox.appendChild(canvas);
          pagesContainer.appendChild(pageBox);
          pages.push({ canvas, pngName });
        }

        return {
          key: report.key,
          title: report.title,
          pdfBlob,
          pdfName: report.pdfName,
          pdfUrl,
          pages,
        };
      }

      async function downloadPngAndSendMail() {
        if (state.sending || !state.packageData) {
          return;
        }

        const summary = state.packageData.sendSummary || {};
        const confirmed = window.confirm(
          [
            '모든 PNG를 다운로드하고 실제 메일을 발송합니다.',
            '',
            `발송 기준일: ${state.packageData.period.dateKorean}`,
            `보고서: ${state.packageData.reportType}`,
            `받는 사람: ${Number(summary.recipientCount || 0)}명`,
            `참조: ${Number(summary.ccCount || 0)}명`,
            `제목: ${summary.subject || ''}`,
            '',
            '계속하시겠습니까?',
          ].join('\n'),
        );
        if (!confirmed) {
          return;
        }

        state.sending = true;
        sendButton.disabled = true;
        errorBox.style.display = 'none';

        try {
          setStatus('모든 PNG 다운로드를 시작하는 중입니다…');
          await downloadAllPng();
          setStatus('PNG 다운로드를 시작했습니다. 실제 메일을 발송하는 중입니다…');

          const result = await sendPreparedPackage({
            dateKey: state.packageData.period.dateKey,
            reportType: state.packageData.reportType,
            reports: state.packageData.reports.map((report) => ({
              key: report.key,
              pdfBase64: report.pdfBase64,
            })),
          });
          if (!result || !result.success) {
            throw new Error(result && result.message ? result.message : '메일 발송 결과를 확인하지 못했습니다.');
          }

          state.sending = false;
          sendButton.textContent = '자료 다운로드·메일 발송 완료';
          showSuccess(`모든 PNG 다운로드를 시작했고 실제 메일 발송을 완료했습니다. ${result.sentAt || ''}`);
        } catch (error) {
          state.sending = false;
          sendButton.disabled = false;
          showError(
            `PNG 다운로드는 시작되었지만 메일 발송을 완료하지 못했습니다.\n${toErrorMessage(error)}`,
          );
        }
      }

      function sendPreparedPackage(preparedPackage) {
        return new Promise((resolve, reject) => {
          window.google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .sendPreparedReportFromDialog(preparedPackage);
        });
      }

      function makeButton(label, className, handler) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label;
        if (className) button.className = className;
        button.addEventListener('click', handler);
        return button;
      }

      function openPdf(url) {
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.target = '_blank';
        anchor.rel = 'noopener';
        anchor.click();
      }

      function base64ToBytes(base64) {
        const binary = window.atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        return bytes;
      }

      function buildPngName(pdfName, pageNumber, pageCount) {
        const baseName = String(pdfName || 'report.pdf').replace(/\.pdf$/i, '');
        return pageCount === 1
          ? `${baseName}.png`
          : `${baseName}_${pageNumber}.png`;
      }

      async function downloadCanvas(canvas, fileName) {
        const blob = await canvasToBlob(canvas);
        downloadBlob(blob, fileName);
      }

      function canvasToBlob(canvas) {
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error('PNG 파일을 만들지 못했습니다.'));
          }, 'image/png');
        });
      }

      function downloadBlob(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = fileName;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      async function downloadAllPdf() {
        for (const report of state.reports) {
          downloadBlob(report.pdfBlob, report.pdfName);
          await delay(350);
        }
      }

      async function downloadAllPng() {
        for (const report of state.reports) {
          for (const page of report.pages) {
            await downloadCanvas(page.canvas, page.pngName);
            await delay(350);
          }
        }
      }

      function delay(milliseconds) {
        return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
      }

      function setStatus(message) {
        statusBox.classList.remove('success');
        statusBox.style.display = 'flex';
        statusText.textContent = message;
      }

      function showSuccess(message) {
        statusBox.classList.add('success');
        statusBox.style.display = 'flex';
        statusText.textContent = message;
      }

      function showError(error) {
        statusBox.style.display = 'none';
        errorBox.textContent = toErrorMessage(error);
        errorBox.style.display = 'block';
      }

      function toErrorMessage(error) {
        if (typeof error === 'string') return error;
        if (error && error.message) return error.message;
        return String(error || '알 수 없는 오류가 발생했습니다.');
      }

      function revokeObjectUrls() {
        state.objectUrls.forEach((url) => URL.revokeObjectURL(url));
        state.objectUrls = [];
      }

      boot();
    </script>
  </body>
</html>
